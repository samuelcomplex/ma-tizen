<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080, user-scalable=no">
<title>Music Assistant TV</title>
<link rel="stylesheet" href="style.css">
<script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body class="view-now idle">
<div id="bg">
  <canvas id="bggl" width="960" height="540"></canvas>
  <canvas id="bg-a" class="bg-layer" width="480" height="270"></canvas>
  <canvas id="bg-b" class="bg-layer" width="480" height="270"></canvas>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
  <div class="bg-shade"></div>
</div>

<main id="stage">
  <!-- Now playing / karaoke -->
  <section id="now">
    <div id="art-wrap"><img id="art" alt=""><div id="art-empty"></div><div id="paused-icon"><i></i><i></i></div></div>
    <div id="meta">
      <div id="player-name"></div>
      <h1 id="title"></h1>
      <div id="artist"></div>
      <div id="album"></div>
      <div id="progress"><div id="bar"><div id="fill"></div></div><div id="times"><span id="pos"></span><span id="dur"></span></div></div>
      <div id="upnext"></div>
    </div>
    <div id="idle">
      <div id="clock"></div>
      <div id="date"></div>
      <div class="idle-title">Nothing playing</div>
      <div class="idle-sub" id="idle-sub"></div>
    </div>
  </section>

  <!-- Party -->
  <section id="party">
    <div id="party-qr-card">
      <div id="party-name"></div>
      <div id="party-qr"></div>
      <div id="party-qr-text"></div>
    </div>
    <div id="party-stack"></div>
    <div id="party-off"></div>
    <div id="ticker"><div id="ticker-inner"></div></div>
  </section>

  <!-- Lyrics, shared by both views -->
  <div id="lyrics"><div id="lyrics-inner"></div></div>
</main>

<canvas id="viz" width="1920" height="1080"></canvas>
<canvas id="confetti" width="1920" height="1080"></canvas>
<div id="banner"></div>
<div id="vol"><div id="vol-name"></div><div id="vol-bar"><i></i></div><div id="vol-num"></div></div>

<div id="hints">
  <span class="hint"><b class="key">OK</b>Menu</span>
  <span class="hint"><b class="key">◀ ▶</b>Skip</span>
  <span class="hint"><b class="key">▲ ▼</b>Volume</span>
  <span class="hint"><b class="key">CH</b>Party mode</span>
  <span class="hint"><b class="key">▶❚❚</b>Pause</span>
</div>

<div id="toast"></div>
<div id="status"></div>

<div id="overlay" class="hidden">
  <div class="panel">
    <h2 id="overlay-title"></h2>
    <div id="overlay-list" class="list"></div>
    <div id="overlay-foot"></div>
  </div>
</div>

<div id="setup" class="hidden">
  <div class="setup-box">
    <div class="brand">Music Assistant <b>TV</b></div>
    <div id="setup-body"></div>
    <div id="setup-msg"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
